# Logstash Configuration - FINAL CORRECTED VERSION
# Tested and working configuration for DevOps Tools Observability

input {
  file {
    path => "/var/log/devops-tools/jenkins_logs.json"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash-jenkins.sincedb"
    codec => "json"
    type => "jenkins"
  }
  
  file {
    path => "/var/log/devops-tools/sonarqube_logs.json"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash-sonarqube.sincedb"
    codec => "json"
    type => "sonarqube"
  }
  
  file {
    path => "/var/log/devops-tools/nexus_logs.json"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash-nexus.sincedb"
    codec => "json"
    type => "nexus-iq"
  }
  
  file {
    path => "/var/log/devops-tools/twistlock_logs.json"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash-twistlock.sincedb"
    codec => "json"
    type => "twistlock"
  }
  
  file {
    path => "/var/log/devops-tools/confluence_logs.json"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash-confluence.sincedb"
    codec => "json"
    type => "confluence"
  }
  
  file {
    path => "/var/log/devops-tools/jira_logs.json"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash-jira.sincedb"
    codec => "json"
    type => "jira"
  }
  
  file {
    path => "/var/log/devops-tools/openshift_logs.json"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash-openshift.sincedb"
    codec => "json"
    type => "openshift"
  }
  
  file {
    path => "/var/log/devops-tools/ansible_logs.json"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash-ansible.sincedb"
    codec => "json"
    type => "ansible"
  }
}

filter {
  # Parse timestamp to @timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Add common fields
  mutate {
    add_field => { 
      "environment" => "production"
      "team" => "devops"
    }
  }

  mutate {
    rename => { "[host][name]" => "host" }
  }
  
  # JENKINS enrichment
  if [type] == "jenkins" {
    mutate {
      add_field => { "tool_category" => "ci-cd" }
    }
    
    if [status] == "FAILURE" or [status] == "ABORTED" {
      mutate { add_field => { "severity" => "high" } }
    } else if [status] == "UNSTABLE" {
      mutate { add_field => { "severity" => "medium" } }
    } else {
      mutate { add_field => { "severity" => "low" } }
    }
    
    ruby {
      code => '
        duration_ms = event.get("duration_ms")
        if duration_ms
          event.set("duration_seconds", duration_ms.to_f / 1000.0)
        end
      '
    }
  }
  
  # SONARQUBE enrichment
  if [type] == "sonarqube" {
    mutate {
      add_field => { "tool_category" => "code-quality" }
    }
    
    if [quality_gate_status] == "FAILED" {
      mutate { add_field => { "severity" => "high" } }
    } else if [quality_gate_status] == "WARN" {
      mutate { add_field => { "severity" => "medium" } }
    } else {
      mutate { add_field => { "severity" => "low" } }
    }
    
    ruby {
      code => '
        bugs = event.get("bugs").to_i rescue 0
        vulns = event.get("vulnerabilities").to_i rescue 0
        smells = event.get("code_smells").to_i rescue 0
        event.set("total_issues", bugs + vulns + smells)
      '
    }
  }
  
  # NEXUS-IQ enrichment
  if [type] == "nexus-iq" {
    mutate {
      add_field => { "tool_category" => "security-scanning" }
    }
    
    if [overall_severity] == "CRITICAL" {
      mutate { add_field => { "severity" => "critical" } }
    } else if [overall_severity] == "SEVERE" {
      mutate { add_field => { "severity" => "high" } }
    } else if [overall_severity] == "MODERATE" {
      mutate { add_field => { "severity" => "medium" } }
    } else {
      mutate { add_field => { "severity" => "low" } }
    }
    
    ruby {
      code => '
        crit = event.get("critical_vulnerabilities").to_i rescue 0
        severe = event.get("severe_vulnerabilities").to_i rescue 0
        moderate = event.get("moderate_vulnerabilities").to_i rescue 0
        event.set("total_vulnerabilities", crit + severe + moderate)
      '
    }
  }
  
  # TWISTLOCK enrichment
  if [type] == "twistlock" {
    mutate {
      add_field => { "tool_category" => "container-security" }
    }
    
    ruby {
      code => '
        critical = event.get("critical_cves").to_i rescue 0
        high = event.get("high_cves").to_i rescue 0
        medium = event.get("medium_cves").to_i rescue 0
        low = event.get("low_cves").to_i rescue 0
        
        if critical > 0
          event.set("severity", "critical")
        elsif high > 0
          event.set("severity", "high")
        elsif medium > 0
          event.set("severity", "medium")
        else
          event.set("severity", "low")
        end
        
        event.set("total_cves", critical + high + medium + low)
      '
    }
  }
  
  # CONFLUENCE enrichment
  if [type] == "confluence" {
    mutate {
      add_field => { "tool_category" => "collaboration" }
    }
    
    ruby {
      code => '
        status_code = event.get("status_code").to_i rescue 200
        
        if status_code >= 500
          event.set("severity", "high")
        elsif status_code >= 400
          event.set("severity", "medium")
        else
          event.set("severity", "low")
        end
      '
    }
  }
  
  # JIRA enrichment
  if [type] == "jira" {
    mutate {
      add_field => { "tool_category" => "project-management" }
    }
    
    if [priority] == "Highest" {
      mutate { add_field => { "severity" => "critical" } }
    } else if [priority] == "High" {
      mutate { add_field => { "severity" => "high" } }
    } else if [priority] == "Medium" {
      mutate { add_field => { "severity" => "medium" } }
    } else {
      mutate { add_field => { "severity" => "low" } }
    }
  }
  
  # OPENSHIFT enrichment
  if [type] == "openshift" {
    mutate {
      add_field => { "tool_category" => "container-platform" }
    }
    
    if [status] == "Failed" or [status] == "CrashLoopBackOff" {
      mutate { add_field => { "severity" => "critical" } }
    } else if [status] == "Pending" {
      mutate { add_field => { "severity" => "medium" } }
    } else {
      mutate { add_field => { "severity" => "low" } }
    }
  }
  
  # ANSIBLE enrichment
  if [type] == "ansible" {
    mutate {
      add_field => { "tool_category" => "automation" }
    }
    
    ruby {
      code => '
        failed = event.get("failed") rescue false
        status = event.get("status") rescue ""
        
        if failed == true or status == "unreachable"
          event.set("severity", "high")
        elsif status == "changed"
          event.set("severity", "medium")
        else
          event.set("severity", "low")
        end
      '
    }
  }
  
  # GeoIP enrichment (optional - only if IP field exists)
  if [ip_address] {
    geoip {
      source => "ip_address"
      target => "geo"
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["localhost:9200"]
    index => "devops-tools-%{[service]}-%{+YYYY.MM.dd}"
  }
  
  # Optional: stdout for debugging (comment out for production)
  stdout {
     codec => rubydebug
  }
}
